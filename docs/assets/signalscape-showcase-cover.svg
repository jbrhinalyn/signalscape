<text x="65" y="157" fill="#a6eff1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">LIVE SIGNALS · LIVING LANDSCAPES</text>
<text x="65" y="213" fill="#f4fbff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">A forest that responds</text>
<text x="65" y="250" fill="#f4fbff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">to human signals.</text>
<text x="65" y="285" fill="#bcd6e3" font-family="Arial, Helvetica, sans-serif" font-size="17">Creative visualization with explicit camera consent</text>
<text x="65" y="311" fill="#bcd6e3" font-family="Arial, Helvetica, sans-serif" font-size="17">and quality-gated pulse and breathing estimates.</text>
