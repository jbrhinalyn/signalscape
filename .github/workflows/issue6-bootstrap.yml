name: Issue 6 foundation bootstrap and Linux check

on:
  push:
    branches:
      - feat/issue-6-desktop-foundation

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Create and commit dependency lockfile once
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: commit reproducible npm lockfile for Issue #6"
            git push origin HEAD:feat/issue-6-desktop-foundation
          fi
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Foundation tests
        run: npm test
      - name: Typecheck renderer and Electron
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Desktop smoke launch (Linux, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libatk-bridge2.0-0 libxss1
          # Electron's Chromium sandbox must have a root-owned setuid helper on Linux.
          # Keep sandboxing enabled; never pass --no-sandbox to work around CI.
          ELECTRON_BINARY="$(node -e "process.stdout.write(require('electron'))")"
          SANDBOX_HELPER="$(dirname "$ELECTRON_BINARY")/chrome-sandbox"
          test -f "$SANDBOX_HELPER"
          sudo chown root:root "$SANDBOX_HELPER"
          sudo chmod 4755 "$SANDBOX_HELPER"
          timeout 60s xvfb-run -a npm run smoke:desktop
