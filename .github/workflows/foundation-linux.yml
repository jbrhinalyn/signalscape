name: SignalScape Quality and Linux Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signalscape-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Lint, format, secrets, types, tests and production build
        run: npm run quality
      - name: M5 camera-free acceptance (nonproduction synthetic SDK)
        run: npm run test:acceptance
      - name: Desktop smoke launch (Linux, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libatk-bridge2.0-0 libxss1
          # Electron's Chromium sandbox must have a root-owned setuid helper on Linux.
          # Keep sandboxing enabled; never pass --no-sandbox to work around CI.
          # Electron 42+ downloads the runtime on demand, not during npm ci.
          npx install-electron --no
          ELECTRON_BINARY="$(node -e "process.stdout.write(require('electron'))")"
          SANDBOX_HELPER="$(dirname "$ELECTRON_BINARY")/chrome-sandbox"
          test -f "$SANDBOX_HELPER"
          sudo chown root:root "$SANDBOX_HELPER"
          sudo chmod 4755 "$SANDBOX_HELPER"
          timeout 60s xvfb-run -a npm run smoke:desktop
      - name: Check packaging inputs (no runtime SDK key)
        run: npm run package:preflight
      - name: Package unsigned Linux review artifacts
        run: npx electron-builder --linux AppImage deb --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify archive, versions and SHA-256 checksums
        run: npm run package:verify:linux
      - name: Install built deb and smoke launch installed app
        run: |
          sudo apt-get install -y ./release/*.deb
          APP_BINARY="$(readlink -f "$(command -v signalscape)")"
          test -f "$APP_BINARY"
          SANDBOX_HELPER="$(dirname "$APP_BINARY")/chrome-sandbox"
          test -f "$SANDBOX_HELPER"
          sudo chown root:root "$SANDBOX_HELPER"
          sudo chmod 4755 "$SANDBOX_HELPER"
          SIGNALSCAPE_SMOKE_TEST=1 timeout 60s xvfb-run -a "$APP_BINARY"
      - name: Upload Linux review artifacts (not release-approved)
        uses: actions/upload-artifact@v4
        with:
          name: signalscape-linux-${{ github.sha }}
          path: |
            release/SignalScape-*.AppImage
            release/SignalScape-*.deb
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14
